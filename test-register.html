<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測試報名表單</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:disabled {
            background: #ccc;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>🧪 測試報名表單</h1>
    
    <form id="registerForm">
        <div class="form-group">
            <label for="name">姓名 *</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="email">電子郵件 *</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="title">身份</label>
            <select id="title" name="title">
                <option value="">請選擇</option>
                <option value="測試用戶">測試用戶</option>
                <option value="內湖高中學生">內湖高中學生</option>
            </select>
        </div>

        <div class="form-group">
            <label for="interest">感興趣的專題</label>
            <select id="interest" name="interest">
                <option value="">請選擇</option>
                <option value="超進化公車">超進化公車</option>
                <option value="AI 網路封包系統">AI 網路封包系統</option>
            </select>
        </div>

        <div class="form-group">
            <label for="expectations">期待</label>
            <textarea id="expectations" name="expectations" rows="3"></textarea>
        </div>

        <button type="submit" id="submitBtn">提交測試</button>
    </form>

    <div id="status"></div>

    <script src="scripts/config.js"></script>
    <script>
        console.log('頁面載入完成');
        console.log('CONFIG:', CONFIG);

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            console.log('表單提交');

            const submitBtn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('status');
            
            submitBtn.disabled = true;
            submitBtn.textContent = '提交中...';
            statusDiv.innerHTML = '';

            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                title: document.getElementById('title').value,
                interest: document.getElementById('interest').value,
                expectations: document.getElementById('expectations').value,
                timestamp: new Date().toLocaleString('zh-TW')
            };

            console.log('發送資料:', data);

            try {
                const url = CONFIG.GOOGLE_SCRIPT_URL;
                console.log('發送到:', url);

                const response = await fetch(url, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                console.log('回應:', response);

                statusDiv.innerHTML = `
                    <div class="status success">
                        <strong>✅ 請求已發送</strong>
                        <p>請檢查 Google Sheets 是否有新資料</p>
                        <p>姓名: ${data.name}</p>
                        <p>信箱: ${data.email}</p>
                    </div>
                `;

                // 重置表單
                this.reset();

            } catch (error) {
                console.error('錯誤:', error);
                statusDiv.innerHTML = `
                    <div class="status error">
                        <strong>❌ 發送失敗</strong>
                        <p>${error.message}</p>
                    </div>
                `;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '提交測試';
            }
        });
    </script>
</body>
</html>
